<!DOCTYPE html>
<html>
<body>

  <h3>PNG/JPG to .bytes File Converter</h3>
  <input type="file" id="fileInput">
  <button onclick="convertToBytes()">Convert & Download as .bytes</button>

  <script>
    function convertToBytes() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert("Pehle image select karo!");
        return;
      }

      const reader = new FileReader();
      
      reader.onload = function(e) {
        const arrayBuffer = e.target.result;
        
        // Raw binary data
        const blob = new Blob([arrayBuffer], {type: "application/octet-stream"});
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        
        // Yahan maine extension ko ".bytes" force kar diya hai
        const originalName = file.name.split('.')[0]; 
        a.download = originalName + ".bytes"; 
        
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        alert("Done! File '" + originalName + ".bytes' download ho gayi hai.");
      };

      reader.readAsArrayBuffer(file);
    }
  </script>

</body>
</html>
