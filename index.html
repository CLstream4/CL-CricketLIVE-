<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { overflow-x: hidden; width: 100%; position: relative; background-color: #050810; margin: 0; color: white; font-family: 'Poppins', sans-serif; text-align: center; }
        
        /* High-Quality Entry Popup Style (Same as Before) */
        #entry-popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 16, 0.95); backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: center; z-index: 99999; transition: opacity 0.5s; }
        .pop-box { background: rgba(255, 255, 255, 0.05); padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .support-text { font-family: 'Bebas Neue', cursive; font-size: 32px; color: #00d2ff; letter-spacing: 1px; margin-bottom: 20px; display: block; }
        .pop-btn { padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; color: white; font-size: 13px; font-family: 'Poppins', sans-serif; }

        /* Site Header Style (Same as Original Style) */
        .site-header { padding: 15px 10px; background: rgba(15, 23, 42, 0.6); }
        .site-header h1 { font-family: 'Orbitron', sans-serif; background: linear-gradient(90deg, #00d2ff, #f9a8d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px; margin: 0; }

        /* VIDEO OVERLAY SYSTEM */
        .video-overlay-container { 
            position: relative; 
            width: 100%; 
            height: auto; 
            max-width: 1000px; /* Optional, keep max width manageable */
            margin: 0 auto;
            overflow: hidden; 
        }

        /* The Main Player with Header Cropping (as requested) */
        #main-player { 
            width: 100%; 
            height: 100vh; /* Takes full viewport height */
            border: 0; 
            position: relative; 
            top: -55px; /* Adjust to perfectly crop their header */
            left: 0;
            z-index: 1; /* Below the overlay */
        }

        /* HIGH-QUALITY BRAND LAYER (Over the video) */
        .brand-layer {
            position: fixed; /* Fixed so it's always visible */
            top: 20px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000; /* Over everything */
            
            /* Modern Glassmorphism Layer */
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(8px);
            padding: 10px 25px;
            border-radius: 50px; /* Pillow shape */
            border: 1px solid rgba(255, 255, 255, 0.2);
            
            /* High Quality Shadow/Glow */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 210, 255, 0.2);
            pointer-events: none; /* Allows interacting with video behind it */
        }

        /* Maintain Brand Style (Orbitron Gradient) */
        .brand-layer h2 {
            font-family: 'Orbitron', sans-serif; 
            background: linear-gradient(90deg, #00d2ff, #f9a8d4); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-size: 18px; 
            margin: 0; 
            font-weight: 900;
        }

        /* LIVE indicator */
        .live-dot { height: 7px; width: 7px; background-color: #00ff00; border-radius: 50%; display: inline-block; margin-right: 4px; animation: pulse 1.5s infinite; vertical-align: middle;}
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Floating Sidebar remains same */
        .floating-sidebar { position: fixed; right: 10px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 10000;}
        .sidebar-icon { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); font-size: 18px; }
    
    </style>
