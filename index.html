        ];

        const channelMap = Object.fromEntries(CHANNELS.map(ch => [ch.id, ch.url]));
        let activeId = CHANNELS[0].id;

        const videoContainer = document.getElementById('videoContainer');
        const channelListEl = document.getElementById('channelList');
        const popupEl = document.getElementById('popup');
        const playerEl = document.getElementById('player');

        function renderChannels() {
            channelListEl.innerHTML = '';
            CHANNELS.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = 'channel-btn' + (ch.id === activeId ? ' active' : '');
                btn.textContent = ch.name;
                btn.dataset.id = ch.id;
                btn.addEventListener('click', () => loadCh(ch.url, ch.id, btn));
                channelListEl.appendChild(btn);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const shareId = params.get('share');
            if (shareId && channelMap[shareId]) {
                document.body.classList.add('share-mode');
                activeId = shareId;
                applyWillowFix(activeId);
                playerEl.src = channelMap[shareId];
            }
            renderChannels();
            popupEl.classList.add('show');
        });

        popupEl.addEventListener('click', (e) => {
            if (e.target === popupEl) hidePopup();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hidePopup();
        });

        function applyWillowFix(id) {
            videoContainer.classList.toggle('willow-ios-mode', id === 'willow_ios');
        }

        function hidePopup() {
            popupEl.classList.remove('show');
        }

        function loadCh(url, id, btn) {
            activeId = id;
            applyWillowFix(id);
            playerEl.src = '';
            setTimeout(() => { playerEl.src = url; }, 50);
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        function getShareUrl() {
            return window.location.origin + window.location.pathname + '?share=' + encodeURIComponent(activeId);
        }

        function copyLink() {
            const cleanShareUrl = getShareUrl();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(cleanShareUrl)
                    .then(() => alert('Link copied: ' + cleanShareUrl))
                    .catch(() => fallbackCopy(cleanShareUrl));
            } else {
                fallbackCopy(cleanShareUrl);
            }
        }

        function fallbackCopy(text) {
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            alert('Link copied: ' + text);
        }

        function shareToWhatsAppDirect() {
            const cleanShareUrl = getShareUrl();
            const shareText = "Watch Live Cricket Match Stream Here: " + cleanShareUrl;
            window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText), "_blank", "noopener,noreferrer");
        }

        const lockOrientation = () => {
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullscreenElement) {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(() => {});
                }
            } else if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        };

        document.addEventListener("fullscreenchange", lockOrientation);
        document.addEventListener("webkitfullscreenchange", lockOrientation);
        document.addEventListener("mozfullscreenchange", lockOrientation);
    </script>
