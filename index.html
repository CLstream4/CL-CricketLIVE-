<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 22%;
            background-color: #0f172a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 2px solid #1e293b;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 10px;
            text-align: center;
        }

        .channel-btn {
            background-color: #1e293b;
            color: #ffffff;
            border: 1px solid transparent;
            padding: 14px 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .channel-btn:hover {
            background-color: #334155;
            border-color: #38bdf8;
        }

        .channel-btn.active {
            background-color: #0284c7;
            border-color: #0ea5e9;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
        }

        /* Video Area */
        .player-area {
            width: 78%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* SMART CROP BOX */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 12px;
            border: 3px solid #1e293b;
            background: #000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        /* Desktop Player Positioning */
        .video-wrapper iframe {
            position: absolute;
            top: -24%;      
            left: 0;      
            width: 100%;    
            height: 124%;   
            border: none;
            background: #000;
        }

        /* SMART FULLSCREEN MODE */
        .video-wrapper.smart-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            z-index: 99999 !important;
            border: none !important;
            border-radius: 0 !important;
        }
        
        .video-wrapper.smart-fullscreen iframe {
            top: -34% !important; /* Fullscreen me safe zone */
            height: 134% !important;
        }

        /* Fullscreen Button Overlay */
        .fs-overlay-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(2, 132, 199, 0.85);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 999999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 📱 MOBILE VIEW OPTIMIZATION (Fixed exact patti issue) */
        @media (max-width: 768px) {
            .container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 45%;
                padding: 15px;
            }
            .player-area {
                width: 100%;
                height: 55%;
                padding: 5px;
            }
            .video-wrapper {
                border-radius: 4px;
                border: 1px solid #1e293b;
                width: 100%;
            }
            
            /* ADJUSTED MOBILE CROP: Normal screen par bhi blue box 100% andar daba diya */
            .video-wrapper iframe {
                top: -34% !important;    /* Isse normal mode me bhi top patti gayab ho jayegi */
                left: 0 !important;   
                width: 100% !important;  
                height: 134% !important; /* Height thodi badhai taaki controls upar khinch kar sahi jagah dikhein */
            }
            .video-wrapper.smart-fullscreen iframe {
                top: -34% !important;
                height: 134% !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar" id="sidebar-menu">
            <h2>⚡ LIVE MATCH</h2>
            <button class="channel-btn active" onclick="changeChannel('https://allroundercrick.pages.dev/?id=fox-sports', this)">🦊 Fox Sports</button>
            <button class="channel-btn" onclick="changeChannel('https://allroundercrick.pages.dev/?id=dsports', this)">🏏 D Sports</button>
            <button class="channel-btn" onclick="changeChannel('https://allroundercrick.pages.dev/?id=zee-eng', this)">📺 Sporza Live</button>
            <button class="channel-btn" onclick="changeChannel('https://allroundercrick.pages.dev/?id=tsn', this)">🏆 WC TV Live</button>
            <button class="channel-btn" onclick="changeChannel('https://allroundercrick.pages.dev/?id=fussball', this)">⚽ Fussball</button>
            <button class="channel-btn" onclick="changeChannel('https://allroundercrick.pages.dev/?id=telemundo', this)">🔥 EN Vivo</button>
        </div>

        <div class="player-area">
            <button class="fs-overlay-btn" onclick="toggleSmartFullscreen()">↕️ Fullscreen</button>
            
            <div class="video-wrapper" id="player-box">
                <iframe 
                    id="live-player" 
                    src="https://allroundercrick.pages.dev/?id=fox-sports" 
                    scrolling="no" 
                    allow="autoplay; encrypted-media; picture-in-picture" 
                    sandbox="allow-scripts allow-same-origin allow-forms"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <script>
        function changeChannel(videoUrl, buttonElement) {
            document.getElementById('live-player').src = videoUrl;

            let buttons = document.getElementsByClassName('channel-btn');
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            buttonElement.classList.add('active');
        }

        function toggleSmartFullscreen() {
            let playerBox = document.getElementById('player-box');
            let fsButton = document.querySelector('.fs-overlay-btn');
            
            playerBox.classList.toggle('smart-fullscreen');
            
            if(playerBox.classList.contains('smart-fullscreen')) {
                fsButton.innerText = "➡️ Exit Fullscreen";
                fsButton.style.position = "fixed";
            } else {
                fsButton.innerText = "↕️ Fullscreen";
                fsButton.style.position = "absolute";
            }
        }
    </script>

</body>
</html>
