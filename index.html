<!DOCTYPE html>
<html>
<body>

  <h3>Image to Original Bytes Converter</h3>
  <input type="file" id="fileInput">
  <button onclick="convertAndDownload()">Convert & Download</button>

  <script>
    function convertAndDownload() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert("Pehle image select karo!");
        return;
      }

      const reader = new FileReader();
      
      reader.onload = function(e) {
        const arrayBuffer = e.target.result;
        
        // Bina kisi type ke, sirf raw bytes
        const blob = new Blob([arrayBuffer]); 
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        
        // Yahan file ka wahi naam rahega jo aapne upload kiya hai
        a.download = file.name; 
        
        document.body.appendChild(a);
        a.click();
        
        // Memory saaf karne ke liye
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      reader.readAsArrayBuffer(file);
    }
  </script>

</body>
</html>
