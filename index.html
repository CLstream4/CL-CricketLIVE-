<!DOCTYPE html>
<html>
<body>

  <h3>PNG to Raw Bytes File Converter</h3>
  <input type="file" id="fileInput">
  <button onclick="downloadAsBytes()">Convert & Download as Bytes</button>

  <script>
    function downloadAsBytes() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert("Pehle file select karo!");
        return;
      }

      const reader = new FileReader();
      
      reader.onload = function(e) {
        const arrayBuffer = e.target.result;
        
        // "application/octet-stream" ka matlab hai "Raw Binary Data"
        const blob = new Blob([arrayBuffer], {type: "application/octet-stream"});
        
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        // File ka extension hum .bin hi rakhenge kyunki game ko "bytes" chahiye
        // Agar game ko sirf file ka naam chahiye, toh hum extension .bin hi force karenge
        a.href = url;
        a.download = file.name.split('.')[0] + ".bin"; 
        
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert("File ready hai! Check karo kya ab game ise accept kar raha hai.");
      };

      reader.readAsArrayBuffer(file);
    }
  </script>

</body>
</html>
