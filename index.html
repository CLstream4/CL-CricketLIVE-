<!DOCTYPE html>
<html>
<body>
    <h3>Ultimate Jersey Packer (Raw Pixel Mode)</h3>
    <input type="file" id="fileInput" accept="image/png">
    <button onclick="packJersey()">Pack As Raw Pixels</button>

    <canvas id="myCanvas" style="display:none;"></canvas>

    <script>
        async function packJersey() {
            const file = document.getElementById('fileInput').files[0];
            const img = new Image();
            img.src = URL.createObjectURL(file);
            
            img.onload = function() {
                const canvas = document.getElementById('myCanvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                // Image ke pixels ko extract karo (RGBA format)
                const imageData = ctx.getImageData(0, 0, img.width, img.height);
                const rawBytes = new Uint8Array(imageData.data.buffer);

                // File ko pack karo
                const blob = new Blob([rawBytes], {type: "application/octet-stream"});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = file.name.split('.')[0] + ".bytes";
                a.click();
            };
        }
    </script>
</body>
</html>
