<!DOCTYPE html>
<html>
<head>
    <title>MKTV PREMIUM</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 10px; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 5px; text-align: center; cursor: pointer; border: 1px solid #333; }
        #player { display: none; width: 100%; height: 90vh; border: none; }
    </style>
</head>
<body>

<div id="home">
    <div class="grid" id="list">
        <!-- Yahan tere saare channels -->
        <div class="card" onclick="play('https://tv4wav.pages.dev/?id=1984')">Star Sports 2</div>
        <div class="card" onclick="play('https://tv4wav.pages.dev/?name=fancode')">FanCode</div>
    </div>
</div>

<iframe id="player" src=""></iframe>
<button id="back" onclick="location.reload()" style="display:none; width:100%; padding:15px; background:red;">BACK</button>

<script>
    function play(url) {
        document.getElementById('home').style.display = 'none';
        let p = document.getElementById('player');
        p.src = url;
        p.style.display = 'block';
        document.getElementById('back').style.display = 'block';
        // URL change kar taaki share karne par yahi channel aaye
        history.pushState(null, '', '?live=' + btoa(url));
    }

    window.onload = () => {
        let params = new URLSearchParams(window.location.search);
        let live = params.get('live');
        if(live) play(atob(live));
    }
</script>
</body>
</html>
