<!DOCTYPE html>
<html>
<body>
    <h3>Ultimate Jersey Packer (Unity-Ready)</h3>
    <input type="file" id="fileInput" accept="image/png">
    <button onclick="packJersey()">Pack & Download .bytes</button>

    <script>
        async function packJersey() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) return alert("Pehle PNG select karo!");

            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const uint8 = new Uint8Array(arrayBuffer);

            // Unity Texture header ki pehchan (Iske bina game file nahi uthayega)
            // Hum ek base padding/header add kar rahe hain jo JerseyPacker use karta hai
            const header = new Uint8Array([0x47, 0x47, 0x47, 0x47, 0x00, 0x00, 0x00, 0x00]);
            
            const finalData = new Uint8Array(header.length + uint8.length);
            finalData.set(header);
            finalData.set(uint8, header.length);

            const blob = new Blob([finalData], {type: "application/octet-stream"});
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = file.name.split('.')[0] + ".bytes";
            a.click();
            alert("File pack ho gayi! Ab ise game editor mein use karo.");
        }
    </script>
</body>
</html>
