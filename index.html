<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricketLIVE! Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .top-header { padding: 12px; text-align: center; background: #0f172a; border-bottom: 1px solid #1e293b; }
        .brand-name { font-size: 1.3rem; font-weight: 300; letter-spacing: 1px; background: linear-gradient(135deg, #38bdf8, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .player-section { flex: 1; display: flex; flex-direction: column; width: 100%; height: 60vh; }
        .video-container { width: 100%; height: 100%; background: #000; }
        /* Fix: 'allow' attributes added to ensure media loads */
        iframe { width: 100%; height: 100%; border: none; }

        .channel-list { height: 40vh; overflow-y: auto; background: #080c14; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
        .channel-btn { padding: 12px; background: #1e293b; border: none; color: #fff; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: 0.3s; text-align: center; }
        .channel-btn.active { background: #0284c7; }

        .controls { display: flex; gap: 10px; padding: 10px; background: #080c14; }
        .btn-copy { flex: 1; padding: 10px; background: #334155; border: none; color: #fff; border-radius: 8px; cursor: pointer; font-weight: 600; }

        .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; visibility: hidden; opacity: 0; transition: 0.3s; }
        .popup-overlay.show { visibility: visible; opacity: 1; }
        .popup-box { background: #111726; padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; border: 1px solid #1e293b; }
        .btn-action { display: block; width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; text-decoration: none; color: #fff; }
        .btn-join { background: #25d366; }
        .btn-stream { background: #0284c7; }

        body.share-mode .channel-list, body.share-mode .top-header, body.share-mode .controls { display: none !important; }
        body.share-mode .player-section { height: 100vh; }
    </style>
</head>
<body>

    <div class="top-header"><h1 class="brand-name">CricketLIVE! Official</h1></div>

    <div class="player-section">
        <div class="video-container">
            <!-- Added more permissions to iframe for link stability -->
            <iframe id="player" src="https://cinearena.fun/chns/cignaltv" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <div class="controls">
        <button class="btn-copy" onclick="copyLink()">🔗 Copy Link</button>
    </div>

    <div class="channel-list">
        <button class="channel-btn active" onclick="loadCh('https://cinearena.fun/chns/cignaltv', this)">Cignal Tv</button>
        <button class="channel-btn" onclick="loadCh('https://cinearena.fun/chns/cazetv', this)">Caze Tv</button>
        <button class="channel-btn" onclick="loadCh('https://cinearena.fun/chns/telemundo', this)">Telemundo</button>
        <button class="channel-btn" onclick="loadCh('https://cinearena.fun/chns/zee-bangla', this)">Zee Bangla</button>
        <button class="channel-btn" onclick="loadCh('https://cinearena.fun/chns/m6direct', this)">M6 Direct</button>
        <button class="channel-btn" onclick="loadCh('https://cinearena.fun/chns/tipik', this)">Tipik Tv</button>
        <button class="channel-btn" onclick="loadCh('https://cinearena.fun/chns/dsports', this)">D Sports</button>
    </div>

    <div class="popup-overlay show" id="popup">
        <div class="popup-box">
            <h3>CricketLIVE! Official</h3>
            <p style="margin: 15px 0; color: #94a3b8;">Join for live stream updates!</p>
            <a href="https://whatsapp.com/channel/0029Vb9sfuABA1eqJmiFc91q" target="_blank" class="btn-action btn-join">Join WhatsApp →</a>
            <button class="btn-action btn-stream" onclick="hidePopup()">Continue to Stream →</button>
        </div>
    </div>

    <script>
        function hidePopup() { document.getElementById('popup').classList.remove('show'); }
        
        function loadCh(url, btn) {
            const player = document.getElementById('player');
            // Force refresh of iframe source to bypass cache/blockers
            player.src = '';
            setTimeout(() => { player.src = url; }, 100);
            
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function copyLink() {
            // Using a simple shareable link format
            const shareUrl = window.location.origin + window.location.pathname + '?share=' + btoa(document.getElementById('player').src);
            navigator.clipboard.writeText(shareUrl).then(() => alert('Link copied!'));
        }
        
        const params = new URLSearchParams(window.location.search);
        if(params.has('share')) {
            document.body.classList.add('share-mode');
            document.getElementById('player').src = atob(params.get('share'));
        }
    </script>
</body>
</html>
