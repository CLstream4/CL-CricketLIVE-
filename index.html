<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Container Layout */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 22%;
            background-color: #0f172a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 2px solid #1e293b;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 10px;
            text-align: center;
        }

        .channel-btn {
            background-color: #1e293b;
            color: #ffffff;
            border: 1px solid transparent;
            padding: 14px 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .channel-btn:hover {
            background-color: #334155;
            border-color: #38bdf8;
        }

        .channel-btn.active {
            background-color: #0284c7;
            border-color: #0ea5e9;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
        }

        /* Video Player Main Area */
        .player-area {
            width: 78%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* VIDEO CONTAINER: Isme controls embed kiye hain */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 12px;
            border: 3px solid #1e293b;
            background: #000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* Desktop Player Zoom */
        .video-wrapper iframe {
            position: absolute;
            top: -26%;      
            left: -2%;      
            width: 104%;    
            height: 152%;   
            border: none;
            background: #000;
            z-index: 1;
        }

        /* CUSTOM CONTROLS OVERLAY: Naya quality aur settings panel */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10; /* Iframe ke upar dikhega */
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Jab video container par mouse ya touch ho tabhi controls dikhein */
        .video-wrapper:hover .custom-controls,
        .video-wrapper:active .custom-controls {
            opacity: 1;
        }

        .control-left, .control-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn-icon {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        .control-btn-icon:hover {
            background: #0284c7;
            border-color: #0ea5e9;
        }

        /* Mobile View Optimization */
        @media (max-width: 768px) {
            .container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 45%;
                padding: 15px;
            }
            .player-area {
                width: 100%;
                height: 55%;
                padding: 5px;
            }
            .video-wrapper {
                border-radius: 4px;
                border: 1px solid #1e293b;
                width: 100%;
            }
            
            .video-wrapper iframe {
                top: -36% !important;    
                left: -3% !important;   
                width: 106% !important;  
                height: 168% !important; 
            }

            .custom-controls {
                opacity: 1; /* Mobile par hamesha halka dikhta rahega touch easy karne ke liye */
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <h2>⚡ LIVE MATCH</h2>
            <button class="channel-btn active" onclick="changeChannel('https://allroundercrick.pages.dev/?id=fox-sports', this)">🦊 Fox Sports</button>
            <button class="channel-btn" onclick="changeChannel('https://allroundercrick.pages.dev/?id=dsports', this)">🏏 D Sports</button>
            <button class="channel-btn" onclick="changeChannel('https://allroundercrick.pages.dev/?id=zee-eng', this)">📺 Sporza Live</button>
            <button class="channel-btn" onclick="changeChannel('https://allroundercrick.pages.dev/?id=tsn', this)">🏆 WC TV Live</button>
            <button class="channel-btn" onclick="changeChannel('https://allroundercrick.pages.dev/?id=fussball', this)">⚽ Fussball</button>
            <button class="channel-btn" onclick="changeChannel('https://allroundercrick.pages.dev/?id=telemundo', this)">🔥 EN Vivo</button>
        </div>

        <div class="player-area">
            <div class="video-wrapper">
                <iframe 
                    id="live-player" 
                    src="https://allroundercrick.pages.dev/?id=fox-sports" 
                    scrolling="no" 
                    allow="autoplay; encrypted-media; picture-in-picture" 
                    sandbox="allow-scripts allow-same-origin allow-forms"
                    allowfullscreen>
                </iframe>

                <div class="custom-controls">
                    <div class="control-left">
                        <span style="font-size: 0.85rem; color: #38bdf8; font-weight: bold; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px;">🔴 LIVE HD</span>
                    </div>
                    <div class="control-right">
                        <button class="control-btn-icon" onclick="triggerPlayerSettings()">⚙️ Quality / Audio</button>
                        <button class="control-btn-icon" onclick="toggleFullscreen()">🔲 Fullscreen</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeChannel(videoUrl, buttonElement) {
            document.getElementById('live-player').src = videoUrl;

            let buttons = document.getElementsByClassName('channel-btn');
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            buttonElement.classList.add('active');
        }

        // Jab user Quality par click karega toh ye player ke andar ki native settings toggle karne ka best alternative trigger karega
        function triggerPlayerSettings() {
            alert("Tip: Mobile par player ke beech mein single tap karke aap auto-quality change kar sakte hain!");
        }

        // Fullscreen feature bypass handler
        function toggleFullscreen() {
            let iframe = document.getElementById('live-player');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) { /* Safari */
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) { /* IE11 */
                iframe.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
