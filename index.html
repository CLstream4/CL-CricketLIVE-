<!DOCTYPE html>
<html>
<body>

  <h3>Real Byte File Generator (For Game)</h3>
  <input type="file" id="fileInput">
  <button onclick="generateGameFile()">Generate .bytes File</button>

  <script>
    function generateGameFile() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert("Pehle image select karo!");
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {
        // Yeh line file ke har byte ko as-is read karti hai
        const arrayBuffer = e.target.result;
        
        // Blob ko direct buffer se banaya gaya hai (No encoding change)
        const blob = new Blob([new Uint8Array(arrayBuffer)], {type: "application/octet-stream"});
        
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        // File ka extension .bytes rakha hai
        const name = file.name.split('.')[0];
        a.download = name + ".bytes";
        
        a.href = url;
        a.click();
        
        URL.revokeObjectURL(url);
        alert("File generate ho gayi! Ise game ke folder mein copy karo.");
      };

      // Raw ArrayBuffer mein load karna zaruri hai
      reader.readAsArrayBuffer(file);
    }
  </script>

</body>
</html>
