<!DOCTYPE html>
<html>
<body>

  <h3>Real Byte File Generator</h3>
  <input type="file" id="fileInput">
  <button onclick="convertToRealBytes()">Generate Real Bytes</button>

  <script>
    async function convertToRealBytes() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert("Pehle image select karo!");
        return;
      }

      // 1. File ko ArrayBuffer (Binary) mein read karo
      const arrayBuffer = await file.arrayBuffer();
      
      // 2. Uint8Array mein convert karo (Yeh real bytes hote hain)
      const uint8View = new Uint8Array(arrayBuffer);
      
      // 3. Blob create karo "application/octet-stream" type ke saath
      // Isse file ka internal structure 'raw stream' ban jayega
      const blob = new Blob([uint8View], {type: "application/octet-stream"});
      
      // 4. Download trigger karo
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      
      // Name set karo
      const name = file.name.split('.')[0];
      a.download = name + ".bytes";
      
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>

</body>
</html>
