<!DOCTYPE html>
<html>
<body>
  <h3>Game Byte Generator (Direct Buffer Mode)</h3>
  <input type="file" id="fileInput">
  <button onclick="generateGameBytes()">Generate Raw Bytes File</button>

  <script>
    function generateGameBytes() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (!file) return alert("Select file!");

      const reader = new FileReader();
      reader.onload = function(e) {
        const arrayBuffer = e.target.result;
        
        // Yahan hum file ke pure data ko "Uint8Array" mein le rahe hain
        // Yeh computer ke liye exact "Raw Binary" hai
        const uint8 = new Uint8Array(arrayBuffer);
        
        // Blob create karo bina kisi type define kiye, 
        // taaki browser isme koi metadata ya header na add kare
        const blob = new Blob([uint8]); 
        
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        // Naam wahi rakho jo game mangta hai
        a.download = file.name.split('.')[0] + ".bytes";
        a.href = url;
        a.click();
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
